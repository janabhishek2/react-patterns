<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promises Polyfill</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            position: relative;
        }
        #box {  
            width: 100px;
            min-height: 100px;
            background-color: red;
            top: 0;
            left: 0;
            position: absolute;
            left: 0;
        }

        .container {
            width: 300px;
            height: 200px;
            overflow-y: scroll;
            border: 1px solid black;
        }

        .content {
            width: 100%;;
            height: 2000px;
        }

    </style>
</head>
<body>
    <div class="container" onscroll="handleScroll()">
        <div class="content">
        </div>
    </div>
    <script src="./polyfill-throttle.js"></script>
    <!-- <script src="./polyfill-event-loop.js"></> -->
</body>
</html>
